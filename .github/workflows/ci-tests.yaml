name: Test libgp_parser

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Update and Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel cmake git

      - name: Check out code
        uses: actions/checkout@v4

      # Cache-Tipp: Da Arch so schnell ist, brauchst du oft keinen Cache für kleine Projekte.
      # Wenn du ihn behalten willst, stelle sicher, dass der Pfad absolut ist.
      - name: Configuring CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23

      - name: Building Project
        run: cmake --build build --config Release

      - name: Running Tests
        run: ctest --test-dir build --output-on-failure
